
spring.application.name=delivery-system

# Default to development
spring.profiles.default=dev

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-seconds=900
app.jwt.refresh-token-seconds=604800

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Flyway takes ownership of schema changes (baseline existing databases at version 0)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=120s,recordStats

# Fake data only runs with the seed profile
app.seed.customers=1000
app.seed.deliveries=10000
